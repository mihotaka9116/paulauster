			<h2 class="heading-decoration">ブルックリン・フォリーズ</h2>
			<p class="subtitle">The Brooklyn Follies (2005)</p>
		</div>

		<div class="entry-container">
			<h3>あらすじ：死に場所を探して、生を見つける</h3>
			<p>
				「私は自分の死に場所を探すためにブルックリンへやってきた」。癌を患い、妻と離婚し、孤独な引退生活を送るネイサン・グラスは、残りの人生を静かにやり過ごすつもりでした。しかし、かつての教え子であり甥のトムとの再会をきっかけに、彼の計画は心地よく崩れ去っていきます。
			</p>
			<p>
				古本屋の主、謎めいた美女、傷ついた少女……。ブルックリンの街角で出会う「欠陥だらけだが愛すべき人々」との交流を通じて、ネイサンは再び、生きることの豊かさと滑稽さ（フォリーズ）に目覚めていきます。
			</p>

			<blockquote>
				「人は誰でも、自分の中にある愚かさを祝福する権利がある。それが、私たちが人間であるための唯一の道なのだから」
			</blockquote>

			<h3>考察：オースターが贈る「幸福な例外」</h3>
			<p>
				初期の『ニューヨーク三部作』のような冷徹な自己解体や、『偶然の音楽』のような逃れられない悲劇とは対照的に、本作には全編にわたってユーモアと慈愛が流れています。
			</p>
			<p>
				オースターはここで、「偶然」を人を追い詰める罠としてではなく、人と人を結びつける奇跡の装置として描いています。物語の背景にある9.11テロという巨大な影を意識しつつも、それ以前の「平穏で輝かしい日常」を愛おしむ筆致は、読む者の心を深く癒やします。
			</p>

			<h3>この街で生きるということ</h3>
			<p>
				タイトルの「Follies（愚行・喜劇）」が示す通り、登場人物たちは皆どこか不器用です。しかし、その不器用さを共有し、助け合う姿こそが、コミュニティの本質であることを教えてくれます。オースターが愛したブルックリンという街への、最高のラブレターと言える一冊です。
			</p>
